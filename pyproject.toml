[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "B905", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "F401", "SIM117", "B011"]

[tool.pytest.ini_options]
addopts = "--cov --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
