[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "B905", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "F401", "SIM117", "B011"]

[tool.pytest.ini_options]
addopts = "--cov --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*Using .* with .*starlette.testclient.*",
    "ignore:.*found in sys.modules after import of package.*:RuntimeWarning",
]


[tool.mypy]
python_version = "3.14"
files = ["app", "evaluation", "scripts"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "pyarrow", "pyarrow.*", "onnx", "onnx.*", "tokenizers", "tokenizers.*"]
ignore_missing_imports = true  # these libraries ship no type information
