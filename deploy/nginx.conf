# Edge in front of one or more instances of the service (see docker-compose.yml).
#
# Rate limiting belongs here when there is more than one process: the limiter inside the service is per process.
# The service is started with PPA_SECURITY__RATE_LIMIT_ENABLED=false in that setup.

limit_req_zone $binary_remote_addr zone=ppa_api:10m rate=60r/m;

upstream ppa {
    server app:8000;
    keepalive 16;
}

server {
    listen 80;

    # The upload limit of the service is 10 MB plus the multipart framing.
    client_max_body_size 11m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # Server-sent events: never buffer, and allow a long-lived connection.
    location ~ ^/v1/jobs/[^/]+/events$ {
        proxy_pass http://ppa;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Everything that starts or runs an analysis is rate limited.
    location ~ ^/(v1/(analyze-profile-photo|jobs)|analyze-profile-photo)$ {
        limit_req zone=ppa_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://ppa;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://ppa;
    }
}
