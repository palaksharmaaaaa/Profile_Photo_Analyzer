# One instance of the service behind nginx, which does the rate limiting.
#
#   PPA_API_KEY=change-me docker compose -f deploy/docker-compose.yml up --build
#
# More processes: add more services (or `docker compose up --scale app=3` with a resolver) behind the same upstream.
services:
  app:
    build: ..
    environment:
      PPA_ENVIRONMENT: production
      PPA_SECURITY__API_KEY: ${PPA_API_KEY:?set PPA_API_KEY}
      PPA_SECURITY__RATE_LIMIT_ENABLED: "false" # nginx limits requests
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
