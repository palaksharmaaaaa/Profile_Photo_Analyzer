name: Model evaluation

# Measures the real pipeline on labelled images and fails when a gate in evaluation/gates.json is violated.
# It builds the models (about 1 GB) and downloads about 2,000 labelled images, so it runs weekly and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: pip install -r requirements.lock -r requirements-build.txt -r requirements-eval.txt

      - name: Cache the models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('scripts/build_models.py', 'app/services/model_manager.py', 'app/services/label_prompts.py') }}

      - name: Build the models
        run: |
          python scripts/build_models.py --cleanup
          python scripts/fetch_models.py

      - name: Fetch the labelled images
        run: python scripts/fetch_eval_data.py

      - name: Evaluate and check the gates
        run: python scripts/evaluate.py --workers 2 --gates

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evaluation-report
          path: |
            .eval_data/report.json
            .eval_data/results.jsonl
