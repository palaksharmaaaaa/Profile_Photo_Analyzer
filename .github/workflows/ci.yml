name: CI & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python - lint, types, tests (3.14)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock ruff

      - name: Ruff (lint and format)
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: Tests (100% statement and branch coverage required)
        run: pytest --cov-fail-under=100

      - name: Dependency audit
        run: pip-audit -r requirements.lock

      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml

  frontend:
    name: Browser code - lint and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=moderate

      - uses: actions/upload-artifact@v7
        with:
          name: js-coverage
          path: coverage-js/lcov.info

  sonar:
    name: SonarQube Cloud
    needs: [python, frontend]
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: python-coverage

      - uses: actions/download-artifact@v4
        with:
          name: js-coverage
          path: coverage-js

      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  image:
    name: Docker image builds and starts
    needs: [python]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (models are built inside the image)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: profile-photo-analyzer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The container becomes ready
        run: |
          docker run -d --name ppa -p 8000:8000 profile-photo-analyzer:ci
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/ready > /dev/null; then echo "ready after ${attempt}x2s"; exit 0; fi
            sleep 2
          done
          docker logs ppa
          exit 1
