sonar.projectKey=hgarg02_project-profile-photo-analyzer
sonar.organization=hgarg02
sonar.projectName=Profile Photo Analyzer
sonar.projectVersion=4.0.0

# Python service, evaluation tooling, scripts and the browser code (JavaScript, CSS, HTML) are all analysed.
